worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip on;
  gzip_types text/css application/javascript application/json;

  proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images_cache:10m max_size=500m inactive=30d use_temp_path=off;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver, used with a variable in proxy_pass below
    # so the backend hostname is resolved per-request rather than once at
    # nginx startup — keeps this container from failing to start if it comes
    # up before the backend service does.
    resolver 127.0.0.11 valid=30s;

    location / {
      try_files $uri /index.html;
    }

    location /api/images/ {
      set $backend "http://zh-events-backend:3000";
      proxy_pass $backend;
      proxy_cache images_cache;
      proxy_cache_valid 200 30d;
      proxy_cache_valid 404 502 1m;
      proxy_cache_key $uri;
      add_header X-Cache-Status $upstream_cache_status;
      proxy_set_header Host $host;
    }

    location /api/ {
      set $backend "http://zh-events-backend:3000";
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
