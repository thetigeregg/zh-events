services:
  zh-events-backend:
    build:
      context: ./backend
      # Some hosts' default Docker bridge network has broken/stale NAT rules
      # (seen on the deploy NAS — apk/npm couldn't resolve DNS at all during
      # build, even to a hardcoded public resolver, while every named network
      # worked fine). host networking for the build phase sidesteps that
      # entirely rather than depending on the bridge working.
      network: host
    container_name: zh-events-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Zurich}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      REFRESH_INTERVAL_DAYS: ${REFRESH_INTERVAL_DAYS:-1}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
    volumes:
      - ${DATA_PATH:-./data}:/data
    networks:
      - zh-events-internal

  zh-events-frontend:
    build:
      context: ./frontend
      network: host
    container_name: zh-events-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Zurich}
    depends_on:
      - zh-events-backend
    networks:
      - zh-events-internal
    ports:
      - "${FRONTEND_PORT:-8420}:80"

networks:
  zh-events-internal:
    driver: bridge
